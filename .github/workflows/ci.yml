name: CI

on:
  # Every branch, not just main. Filtering pushes to main meant a feature
  # branch was only ever checked once a pull request existed — so a workflow
  # whose whole purpose is validating work *before* it merges could not run
  # until after it had. Same-repo pull requests will run twice as a result;
  # that is a fair trade for feature branches being covered by default.
  push:
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Current LTS. The hard requirement is 22+, because `node --test`
          # only accepts glob patterns from that version and the test script
          # uses one; 24 is chosen over 22 purely for the longer support
          # window. Node 20 is EOL.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the backend job. Nothing here requires 24 specifically —
          # every dependency's engines field accepts 22.13+ as well. An
          # earlier revision claimed the npm major mattered for `npm ci`;
          # that was wrong. The real cause was a lockfile missing entries
          # for @emnapi/core and @emnapi/runtime, fixed by declaring them
          # in package.json.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The backend is started by playwright.config.ts, so its dependencies
      # have to be present before the test run begins.
      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # No database or ML service is provisioned. The backend falls back to
      # its in-memory store and its JS prediction heuristic, which is exactly
      # what playwright.config.ts sets up locally too.
      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  ml_service:
    name: ML service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml_service/requirements.txt

      - name: Install
        working-directory: ml_service
        run: pip install -r requirements.txt

      - name: Test
        working-directory: ml_service
        run: pytest -q
